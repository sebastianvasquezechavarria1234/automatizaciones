<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Antecedentes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Consulta de Antecedentes</h1>
            <p>Verificación automatizada en la Procuraduría General</p>
        </div>

        <div class="card">
            <form id="antecedentesForm">
                <div class="form-group">
                    <label for="tipo_documento">Tipo de documento</label>
                    <select id="tipo_documento" class="input-control" required>
                        <option value="CC">Cédula de Ciudadanía (CC)</option>
                        <option value="CE">Cédula de Extranjería (CE)</option>
                        <option value="PAS">Pasaporte (PAS)</option>
                        <option value="PEP">PEP</option>
                        <option value="PPT">PPT</option>
                        <option value="NIT">NIT</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="numero_documento">Número de documento</label>
                    <input type="text" id="numero_documento" class="input-control" placeholder="123456789" required autocomplete="off">
                </div>

                <button type="submit" id="btnSubmit" class="btn-submit">
                    <span class="spinner" id="spinner"></span>
                    <span id="btnText">Consultar</span>
                </button>
            </form>

            <div class="loading-text" id="loadingText">
                Procesando consulta<span>.</span><span>.</span><span>.</span>
            </div>

            <div id="result" class="result">
                <div class="result-title" id="resultTitle"></div>
                <div class="result-desc" id="resultDesc"></div>
                <div class="json-box" id="jsonBox"></div>
            </div>
        </div>

        <div class="footer">FastAPI &mdash; Pyppeteer &mdash; Groq</div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
